<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Character Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #viewer {
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 10;
        }

        #error {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            padding: 15px;
            background: #b00020;
            color: white;
            display: none;
            z-index: 20;
        }
    </style>
</head>

<body>

<div id="loading">
    Loading Character...
</div>

<div id="error"></div>

<div id="viewer"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';

import { OrbitControls }
    from 'three/addons/controls/OrbitControls.js';

import { FBXLoader }
    from 'three/addons/loaders/FBXLoader.js';


/* =========================================================
   BASIC SETUP
========================================================= */

const container = document.getElementById("viewer");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(
    3,
    2,
    6
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

container.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2
    );

scene.add(ambientLight);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

keyLight.position.set(
    5,
    8,
    5
);

keyLight.castShadow = true;

scene.add(keyLight);


const fillLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.2
    );

fillLight.position.set(
    -5,
    3,
    2
);

scene.add(fillLight);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.enablePan = false;

controls.minDistance = 1;

controls.maxDistance = 15;


/* =========================================================
   ANIMATION
========================================================= */

const clock = new THREE.Clock();

let mixer = null;

let character = null;


/* =========================================================
   LOAD FBX
========================================================= */

const loader = new FBXLoader();

loader.load(

    "character.fbx",

    function (fbx) {

        character = fbx;

        scene.add(character);


        /* -----------------------------------------
           SCALE
        ----------------------------------------- */

        character.scale.set(
            0.01,
            0.01,
            0.01
        );


        /* -----------------------------------------
           SHADOWS
        ----------------------------------------- */

        character.traverse(
            function (object) {

                if (object.isMesh) {

                    object.castShadow = true;

                    object.receiveShadow = true;

                    if (object.material) {

                        object.material.needsUpdate = true;

                    }

                }

            }
        );


        /* -----------------------------------------
           ANIMATION
        ----------------------------------------- */

        if (
            fbx.animations &&
            fbx.animations.length > 0
        ) {

            mixer =
                new THREE.AnimationMixer(
                    character
                );

            const action =
                mixer.clipAction(
                    fbx.animations[0]
                );

            action.play();

        }


        /* -----------------------------------------
           CENTER CHARACTER
        ----------------------------------------- */

        const box =
            new THREE.Box3()
                .setFromObject(character);

        const center =
            box.getCenter(
                new THREE.Vector3()
            );

        character.position.x -= center.x;

        character.position.z -= center.z;

        character.position.y -= box.min.y;


        /* -----------------------------------------
           CAMERA TARGET
        ----------------------------------------- */

        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const height = size.y;

        controls.target.set(
            0,
            height * 0.5,
            0
        );


        /* -----------------------------------------
           CAMERA
        ----------------------------------------- */

        camera.position.set(
            height * 0.7,
            height * 0.55,
            height * 2.5
        );

        camera.lookAt(
            0,
            height * 0.5,
            0
        );


        document.getElementById(
            "loading"
        ).style.display = "none";

    },

    function (progress) {

        if (progress.total > 0) {

            const percent =
                (progress.loaded /
                progress.total) * 100;

            document.getElementById(
                "loading"
            ).innerText =
                "Loading " +
                Math.round(percent) +
                "%";

        }

    },

    function (error) {

        console.error(error);

        document.getElementById(
            "loading"
        ).style.display = "none";

        const errorBox =
            document.getElementById(
                "error"
            );

        errorBox.style.display = "block";

        errorBox.innerText =
            "Failed to load the FBX file. Check the file path and textures.";

    }

);


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    if (mixer) {

        mixer.update(delta);

    }


    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(
    "resize",
    function () {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
